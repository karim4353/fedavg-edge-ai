name: CI - FedAvg Edge AI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run smoke experiment
        run: |
          python experiments/run_smoke.py

      - name: Verify output files
        run: |
          echo "Checking generated files..."
          test -f results/smoke/accuracy_curves.png || (echo "FAIL: accuracy_curves.png not found" && exit 1)
          test -f results/smoke/loss_curves.png || (echo "FAIL: loss_curves.png not found" && exit 1)
          test -f results/smoke/edge_comparison.png || (echo "FAIL: edge_comparison.png not found" && exit 1)
          test -f results/smoke/results_summary.csv || (echo "FAIL: results_summary.csv not found" && exit 1)
          test -f results/smoke/experiment_log.txt || (echo "FAIL: experiment_log.txt not found" && exit 1)
          echo "All output files verified [OK]"

      - name: Display results summary
        run: |
          echo "=== Results Summary ==="
          cat results/smoke/results_summary.csv
          echo ""
          echo "=== Output Files ==="
          ls -la results/smoke/
