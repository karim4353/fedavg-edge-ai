# Smoke test configuration
# Minimal settings for CI/CD validation (~10 seconds)

experiment:
  name: "smoke_test"
  seed: 42
  verbose: true

data:
  num_clients: 5
  test_size: 0.2

centralized:
  num_epochs: 5
  learning_rate: 0.1
  batch_size: 32

fedsgd:
  num_rounds: 5
  learning_rate: 0.5
  client_fraction: 0.4

fedavg:
  num_rounds: 10
  learning_rate: 0.1
  local_epochs: 3
  batch_size: 10
  client_fraction: 0.4

edge:
  num_rounds: 10
  learning_rate: 0.1
  local_epochs: 3
  batch_size: 10
  client_fraction: 0.4
  quantization: "int8"
  pruning_sparsity: 0.3
